<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../brand/brand.css">
<style>
/* REEL — "the cat is talking to you": 3 real cat signals, each with its own animated illustration.
   Circle-wipe transitions between colour fields, brand supergraphic on every field, logo sign-off. */
:root{--w:1080px;--h:1920px}
.safe-916{left:110px;right:110px}
.beat{position:absolute;inset:0;overflow:hidden;clip-path:circle(0% at 50% 50%);animation:wipe .55s cubic-bezier(.7,0,.2,1) var(--at) forwards}
@keyframes wipe{to{clip-path:circle(75% at 50% 50%)}}
.b1{--at:0s;background:var(--forest);clip-path:none;animation:none}
.b2{--at:2.8s;background:var(--sky)}
.b3{--at:5.6s;background:var(--tang)}
.b4{--at:8.4s;background:var(--sun)}
.b5{--at:11.2s;background:var(--paper)}

.big{font:700 132px/.98 var(--display);color:var(--cream-ink)}
.mid{font:700 118px/1.02 var(--display)}
.idx{font:700 300px/.75 var(--poster)}
.small{font:500 58px/1.3 var(--body)}
.hand{font:700 112px/1 var(--hand)}
.row{display:flex;align-items:flex-end;gap:26px}

.rise{animation:rise .55s cubic-bezier(.2,.9,.25,1.12) var(--d,0s) both}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1) var(--d,0s) both}
@keyframes rise{from{transform:translateY(80px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}

.art{position:absolute;left:50%;width:940px;margin-left:-470px;bottom:430px}
/* blinking eyelids */
.lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:blink var(--bd,1.1s) ease-in-out var(--bt) 1 both}
@keyframes blink{0%{transform:scaleY(0)}40%,60%{transform:scaleY(1)}100%{transform:scaleY(0)}}
.slow{--bd:1.8s}
/* tail */
.tail{transform-box:fill-box;transform-origin:50% 100%;animation:wag .7s ease-in-out var(--d,0s) 4 alternate both}
@keyframes wag{from{transform:rotate(-7deg)}to{transform:rotate(9deg)}}
.tip{transform-box:fill-box;transform-origin:0% 100%;animation:wag .45s ease-in-out var(--d,0s) 6 alternate both}
/* rub against the legs */
.rub{animation:rub .8s ease-in-out var(--d,0s) 3 alternate both}
@keyframes rub{from{transform:translateX(0)}to{transform:translateX(-70px)}}
.heart{transform-box:fill-box;transform-origin:50% 100%;animation:float 1.4s ease-out var(--d,0s) both}
@keyframes float{0%{opacity:0;transform:translateY(30px) scale(.5)}30%{opacity:1}100%{opacity:0;transform:translateY(-160px) scale(1.1)}}
</style></head>
<body><div class="canvas grain">

<!-- BEAT 1 — hook, readable at frame 0 -->
<section class="beat b1">
  <div class="super" style="--c:rgba(255,255,255,.06);width:1500px;left:-620px;top:-200px;transform:rotate(10deg)"></div>
  <div class="safe-916">
    <div class="big" data-text>החתול שלך</div>
    <div class="big" data-text>מדבר איתך.</div>
    <div class="hand rise" data-text style="--d:.9s;color:var(--sun);margin-top:26px">רק לא במילים.</div>
  </div>
  <svg class="art pop" data-art style="--d:.25s" viewBox="0 0 820 620" aria-hidden="true">
    <ellipse cx="410" cy="600" rx="250" ry="18" fill="rgba(0,0,0,.25)"/>
    <path d="M190 210 L215 40 L330 140 Z" fill="#E8641E"/><path d="M630 210 L605 40 L490 140 Z" fill="#E8641E"/>
    <path d="M220 175 L232 85 L295 140 Z" fill="#F4A9A0"/><path d="M600 175 L588 85 L525 140 Z" fill="#F4A9A0"/>
    <ellipse cx="410" cy="350" rx="250" ry="230" fill="#E8641E"/>
    <path d="M410 125 v70 M365 135 l10 55 M455 135 l-10 55" stroke="#B84A10" stroke-width="16" stroke-linecap="round"/>
    <ellipse cx="410" cy="455" rx="120" ry="95" fill="#FFF4EA"/>
    <g><ellipse cx="320" cy="330" rx="48" ry="40" fill="#FFC83D"/><ellipse cx="320" cy="330" rx="12" ry="34" fill="#16261C"/>
       <ellipse class="lid" style="--bt:1.4s" cx="320" cy="330" rx="50" ry="42" fill="#C9520F"/></g>
    <g><ellipse cx="500" cy="330" rx="48" ry="40" fill="#FFC83D"/><ellipse cx="500" cy="330" rx="12" ry="34" fill="#16261C"/>
       <ellipse class="lid" style="--bt:1.4s" cx="500" cy="330" rx="50" ry="42" fill="#C9520F"/></g>
    <path d="M385 410 h50 l-25 28 Z" fill="#E77F86"/>
    <path d="M410 438 v22 M380 470 c15 15 45 15 60 0" stroke="#16261C" stroke-width="8" fill="none" stroke-linecap="round"/>
    <g stroke="#FFF4EA" stroke-width="6" stroke-linecap="round" opacity=".9">
      <path d="M300 440 L150 420 M300 465 L150 480"/><path d="M520 440 L670 420 M520 465 L670 480"/></g>
  </svg>
</section>

<!-- BEAT 2 — tail up -->
<section class="beat b2">
  <div class="super" style="--c:rgba(255,255,255,.09);width:1500px;right:-700px;top:-260px;transform:rotate(-12deg)"></div>
  <div class="safe-916">
    <div class="row"><span class="idx num pop" data-text style="--d:3.1s;color:var(--forest)">1</span>
      <span class="mid rise" data-text style="--d:3.25s;color:var(--ink)">זנב זקוף</span></div>
    <div class="small rise" data-text style="--d:3.6s;color:var(--ink);margin-top:20px">אומר: ״איזה כיף שחזרת.״</div>
  </div>
  <svg class="art" data-art viewBox="0 0 820 620" aria-hidden="true">
    <ellipse cx="410" cy="600" rx="230" ry="18" fill="rgba(0,0,0,.2)"/>
    <ellipse cx="410" cy="470" rx="190" ry="130" fill="#E8641E"/>
    <ellipse cx="300" cy="580" rx="40" ry="22" fill="#C9520F"/><ellipse cx="520" cy="580" rx="40" ry="22" fill="#C9520F"/>
    <g class="tail" style="--d:3.2s"><path d="M410 360 C 400 260, 420 160, 410 70" stroke="#E8641E" stroke-width="54" fill="none" stroke-linecap="round"/>
      <path class="tip" style="--d:3.2s" d="M410 90 C 420 50, 450 30, 480 40" stroke="#C9520F" stroke-width="50" fill="none" stroke-linecap="round"/></g>
    <path d="M300 380 L320 300 L370 360 Z M520 380 L500 300 L450 360 Z" fill="#C9520F"/>
  </svg>
</section>

<!-- BEAT 3 — slow blink -->
<section class="beat b3">
  <div class="super" style="--c:rgba(150,50,0,.12);width:1500px;left:-650px;bottom:-300px;transform:rotate(8deg)"></div>
  <div class="safe-916">
    <div class="row"><span class="idx num pop" data-text style="--d:5.9s;color:var(--forest)">2</span>
      <span class="mid rise" data-text style="--d:6.05s;color:var(--cream-ink)">מצמוץ איטי</span></div>
    <div class="small rise" data-text style="--d:6.4s;color:var(--cream-ink);margin-top:20px">אומר: ״אני סומך עליך.״ מצמצו לו בחזרה.</div>
  </div>
  <svg class="art" data-art viewBox="0 0 820 620" aria-hidden="true">
    <g><ellipse cx="260" cy="330" rx="150" ry="120" fill="#FFC83D"/><ellipse cx="260" cy="330" rx="34" ry="105" fill="#16261C"/><circle cx="225" cy="280" r="18" fill="#fff"/>
       <ellipse class="lid slow" style="--bt:6.7s" cx="260" cy="330" rx="156" ry="126" fill="#C9520F"/></g>
    <g><ellipse cx="560" cy="330" rx="150" ry="120" fill="#FFC83D"/><ellipse cx="560" cy="330" rx="34" ry="105" fill="#16261C"/><circle cx="525" cy="280" r="18" fill="#fff"/>
       <ellipse class="lid slow" style="--bt:6.7s" cx="560" cy="330" rx="156" ry="126" fill="#C9520F"/></g>
  </svg>
</section>

<!-- BEAT 4 — rubbing against legs -->
<section class="beat b4">
  <div class="super" style="--c:rgba(232,100,30,.12);width:1500px;right:-650px;top:-200px;transform:rotate(-8deg)"></div>
  <div class="safe-916">
    <div class="row"><span class="idx num pop" data-text style="--d:8.7s;color:var(--tang)">3</span>
      <span class="mid rise" data-text style="--d:8.85s;color:var(--forest)">מתחכך ברגליים</span></div>
    <div class="small rise" data-text style="--d:9.2s;color:var(--ink);margin-top:20px">אומר: ״אתה שלי.״ ריח זה חתימה.</div>
  </div>
  <svg class="art" data-art viewBox="0 0 820 620" aria-hidden="true">
    <ellipse cx="420" cy="600" rx="300" ry="18" fill="rgba(0,0,0,.18)"/>
    <rect x="520" y="0" width="90" height="590" rx="30" fill="#0A4D2C"/><rect x="640" y="0" width="90" height="590" rx="30" fill="#0A4D2C"/>
    <rect x="505" y="560" width="120" height="40" rx="18" fill="#16261C"/><rect x="625" y="560" width="120" height="40" rx="18" fill="#16261C"/>
    <g class="rub" style="--d:8.8s">
      <ellipse cx="380" cy="480" rx="170" ry="95" fill="#E8641E"/>
      <circle cx="530" cy="420" r="80" fill="#E8641E"/>
      <path d="M480 360 L495 300 L530 345 Z M580 360 L570 300 L540 345 Z" fill="#C9520F"/>
      <path d="M500 420 q14 -14 28 0 M548 420 q14 -14 28 0" stroke="#16261C" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path d="M215 470 C 140 450, 120 360, 170 330" stroke="#E8641E" stroke-width="40" fill="none" stroke-linecap="round"/>
    </g>
    <path class="heart" style="--d:9.3s" d="M560 250 c -30 -40 -90 -10 -60 40 l 60 55 l 60 -55 c 30 -50 -30 -80 -60 -40 z" fill="#E77F86"/>
  </svg>
</section>

<!-- BEAT 5 — sign-off -->
<section class="beat b5">
  <div class="safe-916" style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:30px">
    <div class="mid rise" data-text style="--d:11.5s;color:var(--forest);font-size:96px">אצלכם בבית יש חתול פטפטן?</div>
    <div class="hand rise" data-text style="--d:11.85s;color:var(--tang);font-size:100px">ספרו לנו בתגובות</div>
    <img class="logo-full pop" data-art src="../../brand/logo.png" alt="אקונה מטטה" style="--d:12.1s;width:520px;margin-top:30px">
    <div class="rise" data-text style="--d:12.4s;font:500 44px/1.3 var(--body);color:var(--ink)">ויצמן 24, נתניה · <span class="phone">052-5284448</span></div>
  </div>
</section>
</div></body></html>
