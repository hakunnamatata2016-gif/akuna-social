<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="../brand/brand.css">
<style>
/* STORY 1080x1920 — same post, re-composed vertically. Story UI covers ~250px top and ~280px bottom. */
:root{--w:1080px;--h:1920px}
.canvas{background:var(--forest)}
.kicker{position:absolute;top:230px;right:90px;font:700 40px/1 var(--body);color:var(--sun);display:flex;gap:14px;align-items:center}
.kicker i{display:block;width:50px;height:5px;background:var(--sun);border-radius:4px}
h1{position:absolute;top:295px;right:90px;left:90px;font:700 128px/1 var(--display);color:var(--cream-ink)}
h1 em{font-style:normal;color:var(--sun)}
.plate{position:absolute;left:50%;top:590px;width:700px;height:700px;margin-left:-350px;border-radius:50%;background:#fff;box-shadow:0 40px 90px -30px rgba(0,0,0,.6)}
.shot{position:absolute;left:50%;top:640px;width:600px;height:600px;margin-left:-300px;object-fit:contain;clip-path:circle(348px at 300px 300px)}
.tag{position:absolute;right:70px;top:1090px;padding:26px 34px 22px;background:var(--sun);color:var(--forest);border-radius:22px 22px 22px 80px;transform:rotate(5deg);box-shadow:0 24px 40px -18px rgba(0,0,0,.5)}
.tag small{display:block;font:500 30px/1 var(--body)}
.tag .price{display:block;font:700 150px/.9 var(--poster);margin-top:8px}
.tag .price span{font-size:.5em;margin-inline-start:8px}
.name{position:absolute;top:1335px;right:90px;left:90px;text-align:center;font:500 44px/1.35 var(--body);color:var(--cream-ink)}
.name b{color:var(--sun);font-weight:700}
.ctas{position:absolute;top:1475px;left:0;right:0;display:flex;justify-content:center}
.super{z-index:0}
</style></head>
<body><div class="canvas grain">
  <div class="super" data-art data-overlap-ok style="--c:rgba(255,255,255,.06);width:1500px;left:-700px;top:-160px;transform:rotate(10deg)"></div>
  <div class="kicker"><i></i>מוצר השבוע · כלבים</div>
  <h1>הכלב לא קורא רכיבים. <em>אתם כן.</em></h1>
  <div class="plate" data-art data-overlap-ok></div>
  <img class="shot" data-art src="assets/product-test.png" alt="">
  <div class="tag"><small>מחיר באתר היום</small><span class="price"><span>₪</span>299</span></div>
  <div class="name"><b>מונג׳ סלמון ואורז · 12 ק״ג</b><br>שק שני ב־<span class="num">10%</span> הנחה · ויצמן 24, נתניה</div>
  <div class="ctas"><div class="cta"><svg viewBox="0 0 32 32"><path fill="#fff" d="M16 3a13 13 0 0 0-11.2 19.6L3 29l6.6-1.7A13 13 0 1 0 16 3zm0 23.6c-2 0-4-.6-5.7-1.6l-.4-.2-3.9 1 1-3.8-.3-.4A10.6 10.6 0 1 1 16 26.6zm5.8-7.9c-.3-.2-1.9-.9-2.2-1-.3-.1-.5-.2-.7.2l-1 1.2c-.2.2-.4.2-.7.1a8.7 8.7 0 0 1-4.3-3.8c-.3-.6.3-.5 1-1.6.1-.2 0-.4 0-.6l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.2-1.2 2.9s1.2 3.4 1.4 3.6c.2.2 2.4 3.7 5.9 5.2 2.2.9 3 1 4.1.8.7-.1 1.9-.8 2.2-1.5.3-.7.3-1.4.2-1.5-.1-.1-.3-.2-.6-.4../svg><span class="phone">052-5284448</span></div></div>
  <div class="strip" style="height:300px;bottom:0;align-items:flex-start;padding-top:46px"><img class="lockup" src="../brand/lockup-h.png" alt="אקונה מטטה"><div class="where"><b>a-matata.co.il</b><br>משלוח חינם מעל <span class="num">250</span> ₪</div></div>
</div></body></html>
