<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="../brand/brand.css">
<style>
/* TEMPLATE: reel (1080x1920, ~10s) — kinetic typography, one idea per beat, hard cuts between colour fields.
   Every beat is an absolutely positioned .beat with its own in/out keyframes and delay.
   render.py steps document.getAnimations() frame by frame, so timing here is exact. */
:root{--w:1080px;--h:1920px}
.safe-916{left:120px;right:120px}
.canvas{background:var(--forest)}
.beat{position:absolute;inset:0;opacity:0;animation:show var(--len) steps(1,end) var(--at) forwards}
@keyframes show{0%{opacity:1}100%{opacity:1}}
/* each beat is visible from --at for --len, then the next one covers it */
.b1{--at:0s;--len:2.4s;background:var(--forest);z-index:1}
.b2{--at:2.4s;--len:2s;background:var(--sky);z-index:2}
.b3{--at:4.4s;--len:2s;background:var(--tang);z-index:3}
.b4{--at:6.4s;--len:2s;background:var(--sun);z-index:4}
.b5{--at:8.4s;--len:3.6s;background:var(--paper);z-index:5}

.big{font:700 138px/.98 var(--display);color:var(--cream-ink)}
.mid{font:700 132px/1 var(--display)}
.idx{font:700 680px/.72 var(--poster);display:block;margin-bottom:30px}
.hand{font:700 124px/1 var(--hand)}
/* motion vocabulary: rise, pop, slap (sticker landing) */
.rise{animation:rise .5s cubic-bezier(.2,.9,.25,1.15) var(--d,0s) both}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1) var(--d,0s) both}
.slap{animation:slap .35s cubic-bezier(.3,1.5,.5,1) var(--d,0s) both}
@keyframes rise{from{transform:translateY(90px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes slap{from{transform:scale(1.8) rotate(-18deg);opacity:0}to{transform:rotate(-6deg);opacity:1}}
.wiggle{animation:wig .6s ease-in-out var(--d,0s) 4 alternate both}
@keyframes wig{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}

.dog{position:absolute;left:50%;bottom:430px;width:640px;margin-left:-320px}
.strip{height:170px}
</style></head>
<body><div class="canvas grain">

  <!-- BEAT 1 — hook (first 1.5s decides everything) -->
  <section class="beat b1">
    <div class="safe-916" style="display:flex;flex-direction:column;justify-content:flex-start;gap:30px">
      <div class="big" data-text>הכלב שלך</div>
      <div class="big rise" data-text style="--d:.35s;color:var(--sun)">מפרק את הבית?</div>
      <div class="hand rise" data-text style="--d:1.1s;color:var(--cream-ink)">3 סימנים שהוא משועמם ↓</div>
    </div>
    <svg class="dog pop" data-art style="--d:.6s" viewBox="0 0 560 520" aria-hidden="true">
      <ellipse cx="280" cy="500" rx="200" ry="16" fill="rgba(0,0,0,.25)"/>
      <path d="M110 120 C 40 140, 20 300, 80 360 C 120 300, 140 220, 170 170 Z" fill="#C94D0C"/>
      <path d="M450 120 C 520 140, 540 300, 480 360 C 440 300, 420 220, 390 170 Z" fill="#C94D0C"/>
      <ellipse cx="280" cy="270" rx="190" ry="200" fill="#EC6519"/>
      <ellipse cx="280" cy="360" rx="110" ry="85" fill="#FFF6E9"/>
      <circle cx="205" cy="240" r="26" fill="#16261C"/><circle cx="355" cy="240" r="26" fill="#16261C"/>
      <circle cx="214" cy="231" r="8" fill="#fff"/><circle cx="364" cy="231" r="8" fill="#fff"/>
      <ellipse cx="280" cy="320" rx="40" ry="28" fill="#16261C"/>
      <path d="M280 348 v28 M250 380 C 265 395, 295 395, 310 380" stroke="#16261C" stroke-width="9" fill="none" stroke-linecap="round"/>
      <!-- the evidence: a sock -->
      <g transform="translate(300 400) rotate(18)"><path d="M0 0 h70 v90 c0 30 -20 40 -50 40 h-60 c-20 0 -25 -30 0 -36 h40 Z" fill="#18A7DA"/><rect x="0" y="0" width="70" height="20" fill="#FFF6E9"/></g>
    </svg>
  </section>

  <!-- BEATS 2-4 — one sign each: giant number, short line -->
  <section class="beat b2"><div class="safe-916" style="display:flex;flex-direction:column;justify-content:center">
    <span class="idx pop num" data-text style="--d:2.45s;color:var(--forest)">1</span>
    <div class="mid rise" data-text style="--d:2.65s;color:var(--ink)">נובח על כל עלה שזז</div>
  </div></section>

  <section class="beat b3"><div class="safe-916" style="display:flex;flex-direction:column;justify-content:center">
    <span class="idx pop num" data-text style="--d:4.45s;color:var(--forest)">2</span>
    <div class="mid rise" data-text style="--d:4.65s;color:var(--cream-ink)">גרביים נעלמות. רק השמאליות.</div>
  </div></section>

  <section class="beat b4"><div class="safe-916" style="display:flex;flex-direction:column;justify-content:center">
    <span class="idx pop num" data-text style="--d:6.45s;color:var(--tang)">3</span>
    <div class="mid rise" data-text style="--d:6.65s;color:var(--forest)">רודף אחרי הזנב. ותופס.</div>
  </div></section>

  <!-- BEAT 5 — the turn + where to go. Ends on paper so the logo sits in its own colours. -->
  <section class="beat b5"><div class="safe-916" style="display:flex;flex-direction:column;justify-content:flex-start;gap:28px">
    <div class="mid rise" data-text style="--d:8.45s;color:var(--forest);font-size:104px">הפתרון: 10 דקות משחק חשיבה ביום.</div>
    <div class="hand rise" data-text style="--d:8.8s;color:var(--tang)">צעצועי לעיסה וחידות מחכים בחנות</div>
    <img class="logo-full pop" data-art src="../brand/logo.png" alt="אקונה מטטה" style="--d:9.1s;width:560px;margin-top:40px;align-self:center">
    <div class="rise" data-text style="--d:9.4s;font:500 46px/1.3 var(--body);color:var(--ink);text-align:center">ויצמן 24, נתניה · <span class="phone">052-5284448</span></div>
  </div>
    </section>
</div></body></html>
